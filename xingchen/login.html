<!DOCTYPE html>
<html lang="zh-CN" data-login-page>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 星辰班级</title>
<script src="assets/js/auth.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    color: #f4f6fb;
    background:
      radial-gradient(900px 600px at 15% 10%, rgba(255,122,69,.16), transparent 60%),
      radial-gradient(700px 500px at 85% 85%, rgba(72,132,255,.14), transparent 60%),
      linear-gradient(160deg, #0a1120 0%, #121d33 55%, #0d1626 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px;
    padding: 42px 38px 34px;
    border-radius: 24px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.8);
    backdrop-filter: blur(14px);
  }
  .mark {
    width: 54px; height: 54px; margin: 0 auto 18px;
    border-radius: 17px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff;
    background: linear-gradient(135deg, #ff8a5c, #e8433a);
    box-shadow: 0 12px 28px -10px rgba(232,67,58,.9);
  }
  h1 { margin: 0; text-align: center; font-size: 26px; letter-spacing: 4px; font-weight: 600; }
  .sub { margin: 10px 0 30px; text-align: center; font-size: 13px; letter-spacing: 2px; color: #9aa8c2; }
  label { display: block; margin-bottom: 18px; font-size: 13px; letter-spacing: 1px; color: #c4cde0; }
  input {
    display: block; width: 100%; margin-top: 9px; padding: 13px 15px;
    font-size: 15px; font-family: inherit; color: #fff;
    background: rgba(0,0,0,.26);
    border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #77839b; font-size: 13px; }
  input:focus { border-color: #ff8a5c; box-shadow: 0 0 0 3px rgba(255,138,92,.16); }
  button {
    width: 100%; margin-top: 6px; padding: 14px;
    font-size: 15px; font-family: inherit; font-weight: 600; letter-spacing: 3px;
    color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff8a5c, #e8433a);
    border: 0; border-radius: 12px;
    box-shadow: 0 14px 30px -12px rgba(232,67,58,.9);
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 18px 36px -12px rgba(232,67,58,1); }
  button:active { transform: translateY(0); }
  .msg { min-height: 20px; margin: 14px 0 0; text-align: center; font-size: 13px; color: #ff9b8f; }
  .tip {
    margin-top: 18px; padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.10);
    font-size: 12px; line-height: 2; letter-spacing: .5px; color: #8e9bb3; text-align: center;
  }
  .logout { display: block; margin-top: 14px; text-align: center; font-size: 12px; color: #6e7c96; text-decoration: none; }
  .logout:hover { color: #c4cde0; }
  @media (max-width: 480px) { .card { padding: 34px 24px 26px; } }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✦</div>
    <h1>星辰班级</h1>
    <p class="sub">请登录后继续</p>

    <form id="loginForm" autocomplete="off">
      <label>账号
        <input id="account" type="text" autocomplete="username" placeholder="学生填姓名 ／ 老师填科目名" required />
      </label>
      <label>密码
        <input id="password" type="password" autocomplete="current-password" placeholder="学生填完整学号 ／ 老师填统一密码" required />
      </label>
      <button type="submit">进入班级空间</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="tip">
      学生：账号为本人姓名，密码为完整学号<br />
      老师：账号为科目名（语文 数学 英语 物理 化学 生物），密码统一
    </div>
    <a class="logout" href="#" id="logout">退出登录 / 切换账号</a>
  </div>

  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var account = document.getElementById('account');
      var password = document.getElementById('password');
      var msg = document.getElementById('msg');

      function backTarget() {
        var from = new URLSearchParams(location.search).get('from');
        if (from) {
          try {
            var u = new URL(from, location.href);
            if (location.protocol === 'file:' || u.origin === location.origin) return u.href;
          } catch (e) {}
        }
        return 'index.html';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var a = account.value.trim(), p = password.value.trim();
        if (!a || !p) { msg.textContent = '请填写账号和密码'; return; }
        if (window.XCAuth.verify(a, p)) {
          window.XCAuth.ok();
          location.replace(backTarget());
        } else {
          msg.textContent = '账号或密码不正确，请重新输入';
          password.value = '';
          password.focus();
        }
      });

      document.getElementById('logout').addEventListener('click', function (e) {
        e.preventDefault();
        window.XCAuth.clear();
        msg.textContent = '已退出，可以重新登录';
        account.value = ''; password.value = ''; account.focus();
      });

      account.focus();
    })();
  </script>
</body>
</html>
