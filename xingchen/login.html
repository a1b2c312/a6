<!DOCTYPE html>
<html lang="zh-CN" data-login-page>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 星辰班级</title>
<script src="assets/js/auth.js?v=20261201"></script>
<style>
  :root {
    --bg: #eef1f7;
    --paper: #ffffff;
    --ink: #14171c;
    --ink-soft: #4a5361;
    --ink-faint: #6b7480;
    --line: #e3e6eb;
    --accent: #14171c;
    --font: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
      "Source Han Sans SC", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background-color: var(--bg);
    background-image: repeating-linear-gradient(
      -45deg,
      rgba(20, 23, 28, 0.055) 0 1px,
      transparent 1px 14px
    );
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 410px;
    padding: 36px 32px 28px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 6px solid var(--accent);
    border-radius: 14px;
  }
  .mark {
    display: inline-block;
    padding: 5px 11px 4px;
    border-radius: 4px;
    background: var(--accent);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #fff;
    transform: rotate(-1.2deg);
  }
  h1 { margin: 20px 0 0; font-size: 34px; letter-spacing: .02em; font-weight: 800; line-height: 1.2; }
  .sub { margin: 8px 0 28px; font-size: 13px; color: var(--ink-soft); }

  label { display: block; margin-bottom: 16px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  input {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
    transition: border-color .2s ease, background .2s ease;
  }
  input::placeholder { color: var(--ink-faint); font-size: 13px; }
  input:focus { border-color: var(--accent); background: #fff; }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 13px;
    font-size: 14.5px;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: .12em;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity .2s ease;
  }
  button {
    box-shadow: 0 0 0 0 var(--line);
    transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
  }
  button:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 #cbd1da;
  }
  button:active { transform: translate(0, 0); box-shadow: none; }
  .msg { min-height: 20px; margin: 14px 0 0; font-size: 12.5px; color: #b0233c; }
  .tip {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    line-height: 1.9;
    color: var(--ink-faint);
  }
  .logout { display: inline-block; margin-top: 14px; font-size: 12px; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; }
  .logout:hover { color: var(--ink); }
  @media (max-width: 480px) { .card { padding: 28px 20px 22px; } }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Xing Chen Class</div>
    <h1>星辰班级</h1>
    <p class="sub">请登录后继续</p>

    <form id="loginForm" autocomplete="off">
      <label>账号
        <input id="account" type="text" autocomplete="username" placeholder="学生填姓名 ／ 老师填科目名" required />
      </label>
      <label>密码
        <input id="password" type="password" autocomplete="current-password" placeholder="学生填完整学号 ／ 老师填统一密码" required />
      </label>
      <button type="submit">进入班级空间</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="tip">
      学生：账号为本人姓名，密码为完整学号<br />
      老师：账号为科目名（语文 数学 英语 物理 化学 生物），密码统一
    </div>
    <a class="logout" href="#" id="logout">退出登录 / 切换账号</a>
  </div>

  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var account = document.getElementById('account');
      var password = document.getElementById('password');
      var msg = document.getElementById('msg');

      function backTarget() {
        var from = new URLSearchParams(location.search).get('from');
        if (from) {
          try {
            var u = new URL(from, location.href);
            if (location.protocol === 'file:' || u.origin === location.origin) return u.href;
          } catch (e) {}
        }
        return 'index.html';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var a = account.value.trim(), p = password.value.trim();
        if (!a || !p) { msg.textContent = '请填写账号和密码'; return; }
        if (window.XCAuth.verify(a, p)) {
          window.XCAuth.ok();
          location.replace(backTarget());
        } else {
          msg.textContent = '账号或密码不正确，请重新输入';
          password.value = '';
          password.focus();
        }
      });

      document.getElementById('logout').addEventListener('click', function (e) {
        e.preventDefault();
        window.XCAuth.clear();
        msg.textContent = '已退出，可以重新登录';
        account.value = ''; password.value = ''; account.focus();
      });

      account.focus();
    })();
  </script>
</body>
</html>
